name: Ike Robotics (Nuro)
description: 'Nuro is an autonomous-vehicle technology company that builds the Nuro Driver,
  an AI-first self-driving system it now licenses to automakers and mobility providers
  rather than operating its own delivery fleet. Nuro acquired the assets and team of Ike
  Robotics, an autonomous-trucking startup, folding that self-driving expertise into its
  Level 4 autonomy platform. The company partners with firms such as Uber and Lucid to
  deploy robotaxis and other autonomous applications, and pairs the Nuro Driver with the
  Nuro Toolkit for validation and deployment. Nuro operates a B2B licensing model and does
  not publish a public developer API; this profile captures its public web, security, and
  identity surface. Backed by Bain Capital Ventures.'
